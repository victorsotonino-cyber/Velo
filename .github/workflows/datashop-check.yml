name: DATASHOP checks
on:
  push:
    branches: [rebuild/datashop-prefix-v1]
    paths: ['datashop/**', 'tests/**', '.github/workflows/datashop-check.yml']
  pull_request:
    paths: ['datashop/**', '.github/workflows/datashop-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datashop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        working-directory: .
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        working-directory: .
        run: python -m compileall -q main.py datashop tests
      - name: Run Python tests
        working-directory: .
        run: python -m unittest discover -s tests -v
