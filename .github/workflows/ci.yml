name: Node.js checks

on:
  push:
    branches:
      - main
      - feat/flux-store-commerce-upgrade
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
